# FlowCast dashboard configuration.
# Both themes are defined: the app follows the device setting, and Settings (top-right
# menu) switches between them. dashboard/ui.py reads the active mode for its own styles.

[server]
headless = true
port = 8501
maxUploadSize = 100
enableStaticServing = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = "none"

[runner]
fastReruns = true

# IBM Plex Sans, self-hosted (SIL Open Font License). Its figures are tabular by default.
[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/IBMPlexSans.ttf"
weight = "100 700"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/IBMPlexSans-Italic.ttf"
weight = "100 700"
style = "italic"

[theme]
font = "'IBM Plex Sans', system-ui, sans-serif"
headingFont = "'IBM Plex Sans', system-ui, sans-serif"
baseFontSize = 14
headingFontWeights = [600, 600, 600, 600, 600, 600]
headingFontSizes = ["22px", "16px", "14px", "14px", "13px", "12px"]
baseRadius = "6px"
buttonRadius = "6px"
showWidgetBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#2f6db5"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f5f6"
textColor = "#1d2125"
linkColor = "#2f6db5"
borderColor = "#dfe2e5"
dataframeHeaderBackgroundColor = "#f4f5f6"
dataframeBorderColor = "#e6e8eb"
chartCategoricalColors = ["#2f6db5", "#c9731c", "#8657b5", "#3f9b5a"]

[theme.dark]
primaryColor = "#5591d8"
backgroundColor = "#15181c"
secondaryBackgroundColor = "#1e2227"
textColor = "#e4e7ea"
linkColor = "#7aaae3"
borderColor = "#2c3137"
dataframeHeaderBackgroundColor = "#1e2227"
dataframeBorderColor = "#2c3137"
chartCategoricalColors = ["#5591d8", "#c07630", "#9a76cf", "#4fa66b"]
